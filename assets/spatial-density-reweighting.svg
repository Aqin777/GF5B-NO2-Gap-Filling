<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Spatial-density reweighting schematic</title>
  <desc id="desc">Conceptual diagram showing dense and sparse two-degree blocks receiving inverse-frequency sample weights, then normalization and clipping.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="55" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Spatial-density reweighting</text>
  <text x="55" y="86" font-family="Arial, sans-serif" font-size="16" fill="#556070">Inverse-frequency weighting across fixed 2° × 2° latitude-longitude blocks</text>

  <g transform="translate(70 135)">
    <rect x="0" y="0" width="250" height="250" rx="8" fill="#f5f8fb" stroke="#8090a3" stroke-width="2"/>
    <line x1="125" y1="0" x2="125" y2="250" stroke="#aab5c2" stroke-width="2"/>
    <line x1="0" y1="125" x2="250" y2="125" stroke="#aab5c2" stroke-width="2"/>
    <g fill="#176b87">
      <circle cx="24" cy="24" r="6"/><circle cx="50" cy="28" r="6"/><circle cx="78" cy="24" r="6"/><circle cx="103" cy="40" r="6"/>
      <circle cx="31" cy="61" r="6"/><circle cx="61" cy="63" r="6"/><circle cx="92" cy="75" r="6"/><circle cx="36" cy="99" r="6"/>
      <circle cx="69" cy="105" r="6"/><circle cx="105" cy="102" r="6"/><circle cx="153" cy="34" r="6"/><circle cx="212" cy="88" r="6"/>
      <circle cx="174" cy="176" r="6"/><circle cx="224" cy="214" r="6"/>
    </g>
    <text x="62" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">dense block</text>
    <text x="188" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">sparse block</text>
    <text x="125" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#273246">Count samples in each block</text>
  </g>

  <path d="M360 260 H445" fill="none" stroke="#687789" stroke-width="3"/>
  <path d="M437 252 L447 260 L437 268" fill="none" stroke="#687789" stroke-width="3"/>

  <g transform="translate(470 150)">
    <rect width="200" height="210" rx="12" fill="#edf5f7" stroke="#4a8fa6" stroke-width="2"/>
    <text x="100" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Inverse frequency</text>
    <text x="100" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#176b87">wᵢ ∝ 1 / nᵦ</text>
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#556070">fewer samples</text>
    <text x="100" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#556070">→ larger weight</text>
  </g>

  <path d="M700 260 H785" fill="none" stroke="#687789" stroke-width="3"/>
  <path d="M777 252 L787 260 L777 268" fill="none" stroke="#687789" stroke-width="3"/>

  <g transform="translate(805 150)">
    <rect width="150" height="210" rx="12" fill="#f7f3e8" stroke="#b68a2c" stroke-width="2"/>
    <text x="75" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Normalize</text>
    <text x="75" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#556070">then constrain</text>
    <text x="75" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#8a651b">0.25–4.0</text>
    <text x="75" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#556070">LightGBM</text>
    <text x="75" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#556070">sample_weight</text>
  </g>

  <rect x="70" y="455" width="885" height="60" rx="8" fill="#f5f8fb"/>
  <text x="512" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Goal: limit domination by dense eastern urban observations and improve sparse-region influence</text>
  <text x="512" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667284">Conceptual method diagram — not an empirical map and not a spatial-autocorrelation model</text>
</svg>
